<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script type="importmap">
    { "imports": { "@ikoobee/seating-core": "../packages/seating-core/index.js" } }
  </script>
  <meta charset="UTF-8">
  <title>智能排座 E2E 冒烟测试</title>
  <link rel="stylesheet" href="../css/base.css?v=20260830c">
  <link rel="stylesheet" href="../css/layout.css?v=20260830c">
  <link rel="stylesheet" href="../css/classroom.css?v=20260830c">
  <link rel="stylesheet" href="../css/panels.css?v=20260830c">
  <link rel="stylesheet" href="../css/components.css?v=20260830c">
  <style>
    #e2eResult { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #fff; padding: 8px 14px; font-size: 12px; font-family: monospace; max-height: 45vh; overflow: auto; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
    #e2eResult .ok { color: #16a34a; }
    #e2eResult .bad { color: #dc2626; font-weight: 700; }
  </style>

<body>
  <div id="e2eResult">E2E 运行中…</div>
  <div id="app">
    <header id="topbar" class="topbar"></header>
    <div class="main-layout">
      <aside id="rulesPanel" class="side-panel side-left"></aside>
      <main class="classroom-wrap">
        <div class="podium">讲 台</div>
        <div id="seatGrid" class="seat-grid"></div>
        <div id="statusBar" class="status-bar"></div>
      </main>
      <aside id="studentsPanel" class="side-panel side-right"></aside>
    </div>
  </div>
  <div id="toastHost"></div>
  <div id="modalHost"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="e2e.js"></script>

</html>
